<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Maartens Top 100</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Maartens Top 100: al mijn lijsten sinds 2012, de Top Aller Tijden, Spotify-jaarlijsten, artiesten en records.">
<meta name="theme-color" content="#121a15">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23121a15'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' font-weight='700' text-anchor='middle' fill='%23d4f06a'%3E100%3C/text%3E%3C/svg%3E">
</head>
<body style="margin:0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap">
<style>
/* Layout: smalle kop met navigatie, daaronder één kolom van max 1080px; startpagina = keuzeraster links + spotlight rechts */
:root{
  --bg:#131a16; --surface:#1b241f; --surface-2:#212c26; --line:#2b3730;
  --fg:#eef3ec; --muted:#a4afa7; --faint:#6f7c73;
  --accent:#d8ef5e; --on-accent:#18200f;
  --up:#74d98f; --down:#ff8a76;
  --display:"Fraunces","Iowan Old Style","Georgia",serif;
  --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:clamp(16px,4vw,32px)}
.num{font-variant-numeric:tabular-nums}

/* kop */
.top{border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);z-index:5}
.top .wrap{display:flex;align-items:center;gap:24px;padding-block:14px}
.brand{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;text-decoration:none;white-space:nowrap;font-variation-settings:"opsz" 72}
.brand span{color:var(--accent)}
nav.main{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
nav.main::-webkit-scrollbar{display:none}
nav.main a{text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:999px;white-space:nowrap;font-size:14px}
nav.main a:hover{color:var(--fg);background:var(--surface)}
nav.main a[aria-current="page"]{color:var(--on-accent);background:var(--accent);font-weight:500}

main{padding-block:40px 56px;min-height:60vh}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.025em;text-wrap:balance;margin:0;font-variation-settings:"opsz" 96}
h1{font-size:clamp(30px,5vw,44px);line-height:1.05}
h2{font-size:22px;line-height:1.15}
h3{font-size:18px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:500}
.lede{color:var(--muted);margin:8px 0 0;max-width:62ch}
.muted{color:var(--muted)}

/* startpagina */
.home{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:48px;align-items:start}
.home h2{font-size:24px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px}
.tile{display:block;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-decoration:none;transition:border-color .15s,background .15s}
.tile:hover{border-color:#3f4d44}
.tile b{display:block;font-weight:500;font-size:15px}
.tile small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.tile.latest,.tile[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tile.latest small,.tile[aria-pressed="true"] small{color:#3d4a1f}
.links{display:grid;gap:8px;margin-top:8px}
.links .tile{padding:13px 14px;font-weight:500}
.spot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(20px,3vw,32px);min-width:0}
.spot h2{font-size:26px;margin-top:12px}
.spot .lede{margin-top:10px}
.spot .stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:9px 16px;font-weight:500;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.ghost:hover{border-color:#3f4d44}

/* lijsten */
.rows{margin-top:16px;border-top:1px solid var(--line)}
.row{position:relative;display:grid;grid-template-columns:44px 84px minmax(0,1.3fr) minmax(0,1fr) 56px 36px;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.row:hover,.trow.link:hover{background:var(--surface-2)}
.stretch{text-decoration:none}
.stretch::after{content:"";position:absolute;inset:0}
.stretch:focus-visible{outline:none}
.stretch:focus-visible::after{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.play{position:relative;z-index:1;display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);color:var(--accent);text-decoration:none;font-size:12px;justify-self:end;transition:background .15s,border-color .15s,color .15s}
.play:hover{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.play.busy{animation:pulse 1s ease-in-out infinite}
.play.ready{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.play.big{width:auto;height:auto;border-radius:999px;padding:10px 18px;font-size:15px;font-weight:500;background:var(--accent);color:var(--on-accent);border-color:var(--accent);gap:8px;display:inline-flex}
@keyframes pulse{50%{opacity:.4}}
.player{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(560px,calc(100vw - 24px));z-index:25;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:8px 8px 4px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.player iframe{display:block;width:100%;height:80px;border:0;border-radius:10px}
.player .x{position:absolute;top:-12px;right:-8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font-size:14px;line-height:1}
.player .x:hover{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);color:var(--fg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:min(92vw,520px);z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.pos{font-family:var(--display);font-weight:800;color:var(--accent);font-size:20px;font-variant-numeric:tabular-nums;font-variation-settings:"opsz" 72}
.pos.dim{color:var(--faint);font-size:16px}
.title{font-weight:500;min-width:0;overflow-wrap:anywhere}
.artist{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.pts{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.group{padding:22px 4px 8px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.group h3{font-size:17px}
.group span{color:var(--muted);font-size:13px}

.mv{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.mv.up{color:var(--up)} .mv.down{color:var(--down)} .mv.eq{color:var(--faint)}
.mv.was{color:var(--muted);font-weight:400;font-size:12.5px}
.chip{display:inline-block;font-size:10.5px;letter-spacing:.1em;font-weight:700;text-transform:uppercase;padding:3px 7px;border-radius:5px;white-space:nowrap}
.chip.new{background:var(--accent);color:var(--on-accent)}
.chip.ret{border:1px solid var(--accent);color:var(--accent);padding:2px 6px}
.chip.live{border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent);padding:1px 5px;font-size:9.5px;margin-left:8px;vertical-align:2px}
.stat{display:inline-flex;gap:6px;align-items:baseline;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.stat b{color:var(--fg);font-weight:700;font-variant-numeric:tabular-nums}

.pagehead{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-end}
.pagehead > div{min-width:0}
.pager{display:flex;gap:8px}
.statsline{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px}
.note{margin-top:18px;padding:12px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:14px;max-width:72ch}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:28px}
.search{flex:1 1 220px;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 16px}
.search::placeholder{color:var(--faint)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;color:var(--muted)}
.filters button:hover{color:var(--fg)}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
select.sort{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.count{color:var(--faint);font-size:13px;margin-left:auto}
.empty{padding:28px 4px;color:var(--muted)}

/* overzichten */
.trow.arow{grid-template-columns:44px minmax(0,1fr) 180px 150px}
.trow{position:relative;display:grid;grid-template-columns:44px minmax(0,1.4fr) minmax(0,1fr) 120px 120px 36px;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--accent)}
.bar{display:grid;gap:4px;justify-items:end}
.bar span{font-variant-numeric:tabular-nums;font-weight:500}
.bar i{display:block;height:4px;border-radius:2px;background:var(--accent);opacity:.8;justify-self:stretch;transform-origin:right}
.thead{color:var(--faint);font-size:12px;letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.thead:hover{background:none}
.more{margin-top:20px}

details.art{border-bottom:1px solid var(--line)}
details.art summary{list-style:none;cursor:pointer}
details.art summary::-webkit-details-marker{display:none}
details.art summary .trow{border-bottom:0}
details.art summary:hover{background:var(--surface-2)}
.artsongs{padding:4px 4px 16px 56px;display:grid;gap:2px}
.artsongs a{display:flex;justify-content:space-between;gap:12px;padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--muted)}
.artsongs a:hover{background:var(--surface);color:var(--fg)}

/* records */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;margin-top:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;min-width:0}
.card h2{font-size:19px}
.card p{color:var(--muted);font-size:13.5px;margin:6px 0 12px}
.card ol{list-style:none;margin:0;padding:0;display:grid}
.card li a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:8px 0;border-top:1px solid var(--line);text-decoration:none;align-items:baseline}
.card li a:hover .title{color:var(--accent)}
.card li small{display:block;color:var(--muted);font-size:12.5px}
.card .val{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap;text-align:right}
.card.wide{grid-column:1/-1}

/* wikipedia-info en artiestenpagina */
.wiki{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-top:16px}
.wiki p{margin:0;color:var(--fg);max-width:68ch}
.wiki .src{margin-top:10px;font-size:12.5px;color:var(--muted)}
.wiki .src a{color:var(--accent)}
.wiki img{width:120px;height:120px;object-fit:cover;border-radius:10px;background:var(--surface-2)}
.wiki.loading p{color:var(--muted)}
.wiki h3{font-size:16px;margin-bottom:6px}
.grid{margin-top:16px;overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.grid table{border-collapse:collapse;width:100%;min-width:720px;font-size:13px}
.grid th,.grid td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.grid th{color:var(--faint);font-weight:500;font-size:11.5px;white-space:nowrap}
.grid td.song{text-align:left;padding-left:14px;min-width:180px;position:sticky;left:0;background:var(--surface);z-index:1}
.grid thead th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
.grid td.song a{text-decoration:none;font-weight:500}
.grid td.song a:hover{color:var(--accent)}
.grid td.c span{display:inline-block;min-width:34px;padding:3px 4px;border-radius:6px;font-weight:500}
.grid tr:last-child td{border-bottom:0}
.concert{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:baseline}
.concert small{display:block;color:var(--muted);font-size:12.5px}
.concert a{color:var(--accent);text-decoration:none;font-size:13px;white-space:nowrap}
.concert a:hover{text-decoration:underline}
.albline{display:block;font-size:12.5px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.albline .tag{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.alink{color:inherit;text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--accent) 50%,transparent)}
.alink:hover{color:var(--accent)}

/* platenkaart (hoes + logo in de zijkolom) */
.withcard{display:grid;grid-template-columns:340px minmax(0,1fr);gap:48px;align-items:start}
.platenkaart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.pk-cover{aspect-ratio:1/1;width:100%;max-width:100%;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(135deg,var(--surface-2) 0 14px,#2a362f 14px 28px);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:13px;line-height:1.5;flex-direction:column;gap:4px;padding:12px;box-sizing:border-box}
.pk-cover img{width:100%;height:100%;object-fit:cover;display:block}
.pk-logo{min-height:72px;border-radius:10px;background:#eef3ec;display:flex;align-items:center;justify-content:center;padding:12px 16px}
.pk-logo img{max-width:100%;max-height:84px;object-fit:contain;display:block}
.pk-logo.name{background:transparent;border:1px dashed #3f4d44;font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1;color:var(--fg);text-align:center;letter-spacing:-.01em;overflow-wrap:anywhere}
.pk-facts{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.pk-facts div{display:flex;justify-content:space-between;gap:12px}
.pk-facts b{color:var(--fg);font-weight:500;text-align:right;min-width:0;overflow-wrap:anywhere}
.pk-facts b.acc{color:var(--accent)}
.platenkaart .play.big{justify-content:center}
.withcard .cols2{grid-template-columns:minmax(0,1fr)}
.withcard .wiki img{display:none}
@media (max-width:900px){.withcard{grid-template-columns:minmax(0,1fr);gap:28px}
  .platenkaart{position:static;display:grid;grid-template-columns:132px minmax(0,1fr);align-items:start;gap:14px}
  .pk-cover{grid-row:1/3}.pk-logo{min-height:56px}.pk-logo.name{font-size:19px}
  .platenkaart .play.big{grid-column:2;padding:10px 14px;font-size:14px}.pk-facts{grid-column:1/-1}}

/* nieuwe lijst */
.btn.sm{padding:6px 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.nl-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 63px);z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;margin-bottom:28px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.nl-steps{display:flex;flex-wrap:wrap;gap:4px}
.nl-steps span{font-size:12px;padding:3px 9px;border-radius:999px;color:var(--faint);border:1px solid var(--line)}
.nl-steps span.done{color:var(--muted)}
.nl-steps span.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:500}
.nl-prog{font-size:14px;color:var(--muted);flex:1 1 260px;font-variant-numeric:tabular-nums}
.nl-prog b{color:var(--fg)}
.nl-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px}
.warn{color:var(--down)}
.nl-src{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;margin-top:24px}
.nl-chips{display:flex;flex-wrap:wrap;gap:6px}
.nl-chip{position:relative}
.nl-chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.nl-chip>span{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;color:var(--muted)}
.nl-chip>input:checked+span{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.nl-chip>input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.nl-tog{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:14.5px}
.nl-tog input{accent-color:var(--accent);width:18px;height:18px;margin-top:2px;flex:none}
.nl-tog.off{opacity:.6}
.nl-search .search{max-width:none;width:100%}
.nl-res{display:grid;gap:4px;margin-top:8px}
.nl-res button{display:flex;justify-content:space-between;gap:12px;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.nl-res .acc{color:var(--accent);white-space:nowrap}
.nl-mini{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;font-size:13px}
.nl-mini span{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;display:inline-flex;gap:6px;align-items:center}
.nl-mini button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;padding:0 6px}
.nl-pool{margin-top:28px}
.nl-pool summary{cursor:pointer;color:var(--muted)}
.nl-pair,.nl-trio{display:grid;gap:16px;margin-top:24px}
.nl-pair{grid-template-columns:repeat(2,minmax(0,1fr))}
.nl-trio{grid-template-columns:repeat(3,minmax(0,1fr))}
.nl-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:8px;min-height:170px;min-width:0}
.nl-card.pick{cursor:pointer}
.nl-card.pick:hover{border-color:#3f4d44}
.nl-card.picked{border-color:var(--accent)}
.nl-t{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.15;letter-spacing:-.015em;overflow-wrap:anywhere;padding-right:40px}
.nl-a{color:var(--muted)}
.nl-i{color:var(--faint);font-size:13px}
.nl-c{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.nl-rank{font-size:13px;color:var(--muted)}
.nl-badge{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;font-size:16px}
.nl-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.nl-actions.sub{margin-top:12px}
.nl-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px;margin-top:24px;align-items:start}
.nl-row{display:grid;grid-template-columns:40px minmax(0,1fr) 36px auto;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.nl-row.fin{grid-template-columns:44px 90px minmax(0,1fr) 36px auto}
.nl-rt{min-width:0}
.nl-rt b{font-weight:500;display:block;overflow-wrap:anywhere}
.nl-rt small{color:var(--muted);font-size:13px}
.nl-arrows{display:flex;gap:4px}
.ar{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.ar:disabled{opacity:.3;cursor:default}
.rc-to{width:46px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-align:center;font:inherit;font-size:13px}
.rc-to:focus{outline:none;border-color:var(--accent)}
.rc-out{opacity:.55}
.rc-link{float:right;font-size:13px;color:var(--accent);text-decoration:none;border:1px solid var(--line);padding:6px 10px;border-radius:999px}
.rc-cut{margin:14px 0 4px;padding:8px 10px;border-radius:8px;background:var(--surface);color:var(--accent);font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.nl-row.fin.rc-row{grid-template-columns:44px 150px minmax(0,1fr) 36px auto}
@media (max-width:640px){.nl-row.fin.rc-row{grid-template-columns:34px minmax(0,1fr) 32px auto}.rc-to{width:40px}}
.nl-arrows{align-items:center}

.ar:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.nl-date{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:14px}
.nl-date input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
@media (max-width:760px){
  .nl-pair,.nl-trio,.nl-two{grid-template-columns:minmax(0,1fr)}
  .nl-card{min-height:0;padding:16px}.nl-t{font-size:20px}
  .nl-row.fin{grid-template-columns:34px minmax(0,1fr) 32px auto}.nl-row.fin .mvcell{display:none}
  .nl-bar{top:calc(env(safe-area-inset-top,0px) + 58px);padding:10px 12px}.nl-steps span:not(.on){display:none}
}

/* nummerpagina */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:28px}
.kpis div{background:var(--surface);padding:16px 18px}
.kpis small{display:block;color:var(--muted);font-size:12.5px}
.kpis b{font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;font-variation-settings:"opsz" 72}
.chartbox{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 10px;overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:560px;height:auto}
.chartbox text{fill:var(--muted);font-family:var(--body);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:16px;color:var(--muted);font-size:12.5px;padding:6px 4px 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:-1px}
.legend i.band{border-radius:2px;opacity:.4}
.legend i.dash{background:transparent;border:2px dashed var(--accent);width:10px;height:10px}
.hist{display:grid;grid-template-columns:minmax(0,1fr) 120px 70px 110px;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:center;text-decoration:none}
a.hist:hover{background:var(--surface-2)}
.hist.off{color:var(--faint)}
.back{display:inline-flex;gap:6px;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:20px}
.back:hover{color:var(--fg)}
.cols2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:32px;margin-top:36px;align-items:start}

footer{border-top:1px solid var(--line)}
footer .wrap{padding-block:18px 28px;color:var(--faint);font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}

@media (max-width:820px){
  .home{grid-template-columns:minmax(0,1fr);gap:28px}
  .cols2{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .wiki{grid-template-columns:minmax(0,1fr)}
  .wiki img{width:96px;height:96px;order:-1}
  .top .wrap{gap:14px}
  .row{grid-template-columns:34px 68px minmax(0,1fr) 40px 32px;gap:8px}
  .row .artist{grid-column:3;grid-row:2;margin-top:-8px;font-size:13.5px}
  .row .pts{grid-row:1/3;grid-column:4}
  .row .play{grid-row:1/3;grid-column:5}
  .row .pos,.row .mvcell{grid-row:1/3}
  .trow{grid-template-columns:34px minmax(0,1fr) 80px 32px;gap:8px}
  .trow .artist{grid-column:2;grid-row:2;margin-top:-8px;font-size:13.5px}
  .trow .dotcell{display:none}
  .trow.thead{display:none}
  .trow .pos{grid-row:1/3}
  .trow .bar{grid-row:1/3;grid-column:3}
  .trow .play,.trow .playcell{grid-row:1/3;grid-column:4}
  .trow.arow{grid-template-columns:34px minmax(0,1fr) 110px}.trow.arow .dotcell{display:block;grid-column:2;grid-row:2;font-size:12.5px}.trow.arow .bar{grid-column:3}
  .hist{grid-template-columns:minmax(0,1fr) 90px 60px}
  .hist .mvcell{display:none}
  .artsongs{padding-left:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const normA=s=>norm(s).replace(/[^a-z0-9]/g,"");
function scoreTrack(payload,s){
  const ents=((payload&&payload.entities)||[]).filter(e=>typeof e.uri==="string"&&e.uri.startsWith("spotify:track:"));
  const ta=normA(s.a), tt=normA(s.t.replace(/\(.*?\)/g,""));
  let best=null;
  ents.forEach((e,k)=>{
    const n=normA((e.name||"").replace(/\(.*?\)|-.*$/g,""));
    const art=(e.creators||[]).map(c=>normA(c.name||""));
    const aOk=art.some(c=>c&&(ta.includes(c)||c.includes(ta.slice(0,Math.max(4,Math.min(ta.length,8))))));
    const tOk=n&&tt&&(n===tt||n.startsWith(tt)||tt.startsWith(n));
    const sc=(aOk?2:0)+(tOk?2:0)-k*0.1;
    if(!best||sc>best.sc) best={e,sc,aOk,tOk};
  });
  if(!best) return null;
  return {trackId:best.e.uri.split(":")[2],name:best.e.name||"",artists:(best.e.creators||[]).map(c=>c.name).join(", "),match:best.aOk&&best.tOk?"goed":(best.aOk||best.tOk)?"twijfel":"geen"};
}
function pickTrack(payload,s){
  const ents=(payload&&payload.entities)||[];
  const tracks=ents.filter(e=>typeof e.uri==="string"&&e.uri.startsWith("spotify:track:")&&e.url);
  const want=normA(s.a).slice(0,6);
  return tracks.find(e=>(e.creators||[]).some(c=>{const n=normA(c.name||"");return n.includes(want)||want.includes(n.slice(0,6));}))||tracks[0]||null;
}

  try{
    const res=await mcp.callTool("Spotify","search",{prompt:`${s.t} ${s.a}`,language:"nl-NL",limit:5},{cache:{staleTime:300000,gcTime:86400000}});
    const hit=pickTrack(res.payload,s);

    if(["not_granted","capability_disabled","capability_removed","not_in_manifest","blocked_by_policy","server_not_connected"].includes(code)) mcpOff=true;
    toast(ERR[code]||"Opzoeken lukte nu niet. Klik nog een keer op ▶ voor de zoekresultaten op Spotify.");
    a.classList.add("ready");
  }
});

function pickRandom(n){
  const ids=[...D.alltime];
  for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]];}
  return ids.slice(0,n).sort((a,b)=>S[a].rank-S[b].rank);
}

function viewEdition(i){
  const e=E[i]; if(!e) return viewHome();
  const c=counts(e);
  const ranked=e.kind==="ranked";
  const hasLive=e.rows.some(r=>liveOf(r.id));
  const F=[["alles","Alles"],["nieuw","Nieuw"],["terug","Terug"]];
  const prevRanked=i>0&&E[i-1].kind==="ranked";
  if(ranked&&prevRanked){F.push(["up","Gestegen"],["down","Gedaald"]);}
  if(hasLive)F.push(["live","Live"]);
  let biggest=null; e.rows.forEach(r=>{if(r.mv>0&&(!biggest||r.mv>biggest.mv))biggest=r;});
  app.innerHTML = `<div class="pagehead"><div>
      <div class="eyebrow">Editie ${i+1} van ${N}${e.est?" · geschatte volgorde":e.help?" · met hulp samengesteld":""}</div>
      <h1 style="margin-top:10px">Top 100 · ${fmt(e.date)}${e.est?' <span class="chip ret" style="vertical-align:middle;font-size:12px">Schatting</span>':""}</h1>
      <div class="statsline">
        ${i>0?`<span class="stat"><b>${c.nieuw}</b> nieuw</span><span class="stat"><b>${c.terug}</b> terug</span>`:`<span class="stat">Je eerste lijst: alles is nieuw</span>`}
        ${ranked&&prevRanked?`<span class="stat"><b>${c.up}</b> gestegen</span><span class="stat"><b>${c.down}</b> gedaald</span>`:""}
        ${biggest?`<span class="stat">Grootste stijger: <b>${esc(S[biggest.id].t)}</b> ▲ ${biggest.mv}</span>`:""}
      </div></div>
      <div class="pager">
        ${i>0?`<a class="btn ghost" href="#lijst-${i}" aria-label="Vorige editie">← ${fmtK(E[i-1].date)}</a>`:""}
        ${i<N-1?`<a class="btn ghost" href="#lijst-${i+2}" aria-label="Volgende editie">${fmtK(E[i+1].date)} →</a>`:""}
      </div></div>
    ${kindNote(e)?`<p class="note">${kindNote(e)}</p>`:""}
    ${ranked&&i>0&&!prevRanked?`<p class="note">Je vorige lijst (${fmt(E[i-1].date)}) had geen volgorde. Daarom zie je hier geen stijgers en dalers, wel welke nummers nieuw of terug zijn.</p>`:""}
    <div class="toolbar">
      <input class="search" id="q-lijst" type="search" placeholder="Zoek op artiest of titel" aria-label="Zoek in deze lijst">
      <div class="filters" role="group" aria-label="Filter">${F.map(([k,l],j)=>`<button data-f="${k}" aria-pressed="${j===0}">${l}</button>`).join("")}</div>
      <span class="count" id="cnt"></span>
    </div>
    <div class="rows" id="rows"></div>`;
  let f="alles", q="";
  const render=()=>{
    const qq=norm(q);
    const list=e.rows.filter(r=>{
      const s=S[r.id];
      if(qq && !norm(s.a+" "+s.t).includes(qq)) return false;
      if(f==="nieuw") return r.status==="nieuw";
      if(f==="terug") return r.status==="terug";
      if(f==="up") return r.mv>0;
      if(f==="down") return r.mv<0;
      if(f==="live") return !!liveOf(r.id);
      return true;
    });
    if(f==="up") list.sort((a,b)=>b.mv-a.mv);
    if(f==="down") list.sort((a,b)=>a.mv-b.mv);
    let html="", lastTier=-1;
    list.forEach(r=>{
      const s=S[r.id];
      if(e.kind==="tiers" && r.tier!==lastTier && f!=="up" && f!=="down"){
        const t=e.tiers[r.tier]; lastTier=r.tier;
        html+=`<div class="group"><h3>Niveau ${r.tier+1}</h3><span>plek ${t.lo}–${t.hi} · ${nf(t.pts)} punten per nummer</span></div>`;

        <span class="mvcell">${moveHTML(r)}</span>

        <span class="pts" title="punten">${nf(r.pts)}</span>${playHTML(r.id)}</div>`;
    });

    document.getElementById("cnt").textContent = list.length+" nummers";
  };

const WP="https://{l}.wikipedia.org/w/api.php?format=json&formatversion=2&origin=*&redirects=1&";
async function wpGet(lang,params){
  const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),7000);
  try{ const r=await fetch(WP.replace("{l}",lang)+params,{signal:ctl.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(tm); }
}
const PROPS="prop=extracts|pageimages|langlinks|info|pageprops&ppprop=wikibase_item&exintro=1&explaintext=1&exchars=900&piprop=thumbnail&pithumbsize=320&lllang=nl&inprop=url";
const normT=s=>normA(String(s).replace(/\(.*?\)/g,"")).replace(/^the/,"");
const isDisamb=p=>!p||p.missing||/may refer to|kan verwijzen naar|refer to:/i.test(p.extract||"");
async function wikiFind({title,search,match}){
  const key="wiki4:"+(title||"")+"|"+(search||"");
  try{const c=localStorage.getItem(key); if(c) return JSON.parse(c);}catch(e){}
  let page=null;
  if(title){ const j=await wpGet("en",PROPS+"&titles="+encodeURIComponent(title)); page=(j.query&&j.query.pages||[])[0]; if(isDisamb(page)) page=null; }
  if(!page&&search){
    const j=await wpGet("en",PROPS+"&generator=search&gsrlimit=5&gsrsearch="+encodeURIComponent(search));
    const pages=((j.query&&j.query.pages)||[]).sort((a,b)=>a.index-b.index);
    page=pages.find(p=>!isDisamb(p)&&(!match||normT(p.title).startsWith(match)))||null;
  }
  let out=null;
  if(page){
    out={title:page.title,extract:page.extract||"",url:page.fullurl||("https://en.wikipedia.org/wiki/"+encodeURIComponent(page.title)),thumb:page.thumbnail&&page.thumbnail.source||"",lang:"en",qid:page.pageprops&&page.pageprops.wikibase_item||""};
    const nl=page.langlinks&&page.langlinks[0]&&(page.langlinks[0].title||page.langlinks[0]["*"]);
    if(nl){ try{ const j=await wpGet("nl","prop=extracts|info&exintro=1&explaintext=1&exchars=900&inprop=url&titles="+encodeURIComponent(nl));
      const p=(j.query&&j.query.pages||[])[0]; if(p&&!p.missing&&p.extract){ out.title=p.title; out.extract=p.extract; out.url=p.fullurl||out.url; out.lang="nl"; } }catch(e){} }
  }
  try{localStorage.setItem(key,JSON.stringify(out));}catch(e){}
  return out;
}
const wpSearchLink=q=>"https://nl.wikipedia.org/w/index.php?search="+encodeURIComponent(q);
function wikiBox(elId,label,opts,fallbackQ){
  const el=document.getElementById(elId); if(!el) return;
  el.className="wiki loading"; el.innerHTML=`<div><h3>${esc(label)}</h3><p>Informatie ophalen bij Wikipedia…</p></div>`;
  wikiFind(opts).then(w=>{
    if(!document.body.contains(el)) return;

function artistWiki(a,prefix){
  const parts=COLLAB[a.name];

/* ---------- platenkaart: hoes en logo ----------
   Hoes + album + jaar: iTunes (oudste niet-verzamelalbum), anders de Spotify-hoes.
   Logo: Wikidata (eigenschap 'logo'), anders de naam in grote letters.
   In de Claude-versie mogen geen andere sites worden geladen; dan blijven de vakken staan. */
function jsonp(url){ return new Promise((res,rej)=>{ const cb="cbk"+Math.random().toString(36).slice(2); const s=document.createElement("script");
  const done=()=>{clearTimeout(tm); try{delete window[cb];}catch(e){window[cb]=undefined;} s.remove();};
  const tm=setTimeout(()=>{done();rej(new Error("timeout"));},7000);
  window[cb]=d=>{done();res(d);}; s.onerror=()=>{done();rej(new Error("laden mislukt"));};
  s.src=url+"&callback="+cb; document.head.appendChild(s); }); }
function memo(k,fn){ try{const c=localStorage.getItem(k); if(c!==null) return Promise.resolve(JSON.parse(c));}catch(e){}
  return fn().then(v=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} return v;}); }
const COMP=/greatest|best of|hits|collection|essential|anthology|gold|platinum|ultimate|definitive|the very|the singles|years|jaren|now that|top 40|radio 2|top 2000|anniversary|deluxe|remaster|live/i;
function songMeta(id){
  const s=S[id], title=s.t.replace(/\s+-\s+.*$/,"").replace(/[\(\[].*?[\)\]]/g,"").trim(), artist=s.a.split(/, | & |&| ft\.? | feat\.? /i)[0];
  return memo("meta4:"+id,()=>jsonp("https://itunes.apple.com/search?term="+encodeURIComponent(artist+" "+title)+"&entity=song&limit=25&country=NL").then(d=>{
    const ta=normA(artist).slice(0,6), tt=normA(title);
    const ok=(d.results||[]).filter(r=>{const n=normA(String(r.trackName||"").replace(/\(.*?\)|\s-\s.*$/g,"")); return normA(r.artistName||"").includes(ta)&&n&&(n.startsWith(tt)||tt.startsWith(n));});
    if(!ok.length) return null;
    const pool=ok.filter(r=>!COMP.test(r.collectionName||"")); const list=(pool.length?pool:ok).sort((a,b)=>String(a.releaseDate).localeCompare(String(b.releaseDate)));
    const r=list[0]; return {album:r.collectionName||"",year:String(r.releaseDate||"").slice(0,4),art:String(r.artworkUrl100||"").replace(/100x100bb/,"600x600bb"),preview:r.previewUrl||(ok.find(x=>x.previewUrl)||{}).previewUrl||""};
  }));
}
function fetchT(url,ms=7000){ const c=new AbortController(), t=setTimeout(()=>c.abort(),ms); return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t)); }
function spotifyThumb(id){ const sp=(S[id]&&S[id].sp)||(spotDb[id]&&spotDb[id].trackId); if(!sp) return Promise.resolve(null);
  return memo("oe1:"+sp,()=>fetchT("https://open.spotify.com/oembed?url="+encodeURIComponent("https://open.spotify.com/track/"+sp)).then(r=>r.ok?r.json():null).then(j=>j&&j.thumbnail_url||null)); }
function artistLogo(name){
  const parts=COLLAB[name];
  return memo("logo1:"+name,()=>wikiFind(parts?{title:parts[0]}:{title:WIKI_EN[name],search:name+" band OR singer OR musician",match:normT(name)}).then(w=>{
    if(!w||!w.qid) return null;
    return fetchT("https://www.wikidata.org/w/api.php?action=wbgetclaims&format=json&origin=*&property=P154&entity="+w.qid).then(r=>r.json()).then(j=>{
      const c=j.claims&&j.claims.P154&&j.claims.P154[0], f=c&&c.mainsnak&&c.mainsnak.datavalue&&c.mainsnak.datavalue.value;
      return f?"https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(String(f).replace(/ /g,"_"))+"?width=500":null;});
  }));
}
function setImg(el,url,alt,onfail){ if(!el||!url){ if(onfail) onfail(); return; } const im=new Image(); im.alt=alt; im.decoding="async";
  im.onload=()=>{ if(document.body.contains(el)){ el.textContent=""; el.appendChild(im); el.classList.remove("name"); } };
  im.onerror=()=>{ if(onfail&&document.body.contains(el)) onfail(); }; im.src=url; }
function cardHTML({coverLabel,logoText,playId,facts}){

}

function loadLogo(name){ const lg=live$(document.getElementById("pk-logo")); artistLogo(name).then(u=>{ if(lg()) setImg(lg(),u,"Logo van "+name); }).catch(()=>{}); }
function loadSongCard(id){

  // eendagsvliegen: maar één keer genoteerd, hoogste plek
  const onceAll=Object.values(S).filter(s=>s.n===1);
  const once=all.filter(r=>S[r.id].n===1&&E[r.i].kind==="ranked").sort((a,b)=>a.pos-b.pos).slice(0,5);
  // meeste nummers van één artiest in één lijst (beste lijst per artiest)

    Object.entries(c).forEach(([n,k])=>{ if(!perArt[n]||k>perArt[n].k) perArt[n]={n,k,i}; });});
  const crowd=Object.values(perArt).sort((a,b)=>b.k-a.k||b.i-a.i).slice(0,6);

  app.innerHTML=`<div class="eyebrow">${N} lijsten, ${yr(E[0].date)}–${yr(E[N-1].date)}</div>

function viewSong(id){
  const s=S[id]; if(!s) return viewHome();
  const p=pres[id];
  const W=760,H=280,pl=40,pr=30,pt=30,pb=34, step=(W-pl-pr)/(N-1);
  const x=i=>pl+i*step, y=pos=>pt+(H-pt-pb)*(pos-1)/99;
  let g="";
  [1,25,50,75,100].forEach(v=>g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`);
  E.forEach((e,i)=>g+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${fmtK(e.date)}</text>`);
  // banden voor niveaus en ongeordende lijst
  E.forEach((e,i)=>{const r=p[i]; if(!r||e.kind==="ranked")return;
    const lo=e.kind==="tiers"?e.tiers[r.tier].lo:1, hi=e.kind==="tiers"?e.tiers[r.tier].hi:100;
    g+=`<rect x="${x(i)-7}" y="${y(lo)-3}" width="14" height="${y(hi)-y(lo)+6}" rx="7" fill="var(--accent)" opacity=".3"><title>${fmt(e.date)}: ${placeLabel(e,r)}${e.kind==="tiers"?` (plek ${lo}–${hi})`:""}</title></rect>`;});
  // lijn tussen opeenvolgende posities
  let path="";
  E.forEach((e,i)=>{const r=p[i], q=p[i-1]; if(r&&q&&e.kind==="ranked"&&E[i-1].kind==="ranked"){ const dash=e.est||E[i-1].est;
    g+=`<line x1="${x(i-1)}" y1="${y(q.pos)}" x2="${x(i)}" y2="${y(r.pos)}" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"${dash?' stroke-dasharray="4 5" opacity=".7"':""}/>`;}});
  E.forEach((e,i)=>{const r=p[i]; if(r&&e.kind==="ranked") g+=`<circle cx="${x(i)}" cy="${y(r.pos)}" r="4.5" fill="var(--bg)" stroke="var(--accent)" stroke-width="2.5"${e.est?' stroke-dasharray="3 2.5"':""}><title>${fmt(e.date)}: ${e.est?"≈#"+r.pos+" (schatting)":"#"+r.pos}</title></circle>`
    + `<text x="${x(i)}" y="${y(r.pos)-10}" text-anchor="middle" style="fill:var(--fg);font-weight:500">${e.est?"≈":""}${r.pos}</text>`;});

  const hist=E.map((e,i)=>({e,i})).reverse().map(({e,i})=>{const r=p[i];
    if(!r) return `<div class="hist off"><span>${fmt(e.date)}</span><span>niet genoteerd</span><span></span><span class="mvcell"></span></div>`;
    return `<a class="hist" href="#lijst-${i+1}"><span>${fmt(e.date)}</span><span><b>${placeLabel(e,r)}</b></span><span class="pts">${nf(r.pts)} pt</span><span class="mvcell">${moveHTML(r)}</span></a>`;}).join("");
  const art=artistOf(id), aName=art?art.name:s.a;
  const others=art?art.songs.filter(x=>x!==+id):[];
  const own=s.n>0;
  const q=encodeURIComponent(s.a+" "+s.t);
  const liveS=liveOf(id);
  const card=cardHTML({coverLabel:"Hoes laden…",logoText:s.a,playId:+id,facts:[
    ["Album",s.alb?esc(s.alb):"…","pk-album"],["Jaar",s.yr?esc(s.yr):"…","pk-year"],
    ["Live gezien",liveS?fmt(D.concerts[liveS[0].i].d):"nog niet","",!!liveS],
    ["Spotify-ranglijst",s.spRank?"#"+s.spRank:"–"]]});
  app.innerHTML=`<a class="back" href="javascript:history.back()">← Terug</a>
    <div class="withcard">${card}<div style="min-width:0">
    <div class="pagehead"><div><div class="eyebrow">${art?`<a class="alink" href="#artiest-${slugA(art.name)}">${esc(s.a)}</a>`:esc(s.a)}</div><h1 style="margin-top:10px">${esc(s.t)}</h1></div></div>
    ${own?`<div class="kpis">
      <div><small>Top Aller Tijden</small><b>#${s.rank}</b></div>
      <div><small>Punten</small><b>${nf(s.pts)}</b></div>
      <div><small>Lijsten</small><b>${s.n}<span class="muted" style="font-size:16px"> / ${N}</span></b></div>
      <div><small>Hoogste notering</small><b>${s.best?"#"+s.best:"–"}</b></div>
    </div>
    <div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verloop van ${esc(s.t)} per lijst">${g}</svg>
      <div class="legend"><span><i></i>plek in de lijst</span>${E.some(e=>e.est)?'<span><i class="dash"></i>schatting</span>':""}${E.some(e=>e.kind==="single")?'<span><i class="band"></i>lijst zonder volgorde</span>':""}</div></div>`
    :`<div class="kpis">
      <div><small>Spotify-ranglijst</small><b>#${s.spRank}</b></div>
      <div><small>Spotify-punten</small><b>${nf(s.spPts)}</b></div>
      <div><small>Spotify-jaren</small><b>${s.spN}<span class="muted" style="font-size:16px"> / ${NS}</span></b></div>
      <div><small>Hoogste Spotify-notering</small><b>#${s.spBest}</b></div>
    </div>
    <p class="note"><b>Geen noteringen</b> in je eigen top 100-lijsten. Dit nummer staat alleen in je Spotify-jaarlijsten en telt daarom niet mee voor de Top Aller Tijden.</p>`}
    <div class="cols2">
      <section>${own?`<h2>Per lijst</h2><div class="rows">${hist}</div>`:`<h2>Eigen lijsten</h2><p class="muted">Geen noteringen.</p>`}
        <div style="margin-top:36px">${spotSection(+id)}</div></section>
      <section><section id="wiki-song" style="margin-bottom:28px"></section><div style="margin-bottom:28px">${liveSection(s.lv||aName,"Live gezien")}</div><h2>Meer van ${art?`<a class="alink" href="#artiest-${slugA(art.name)}">${esc(s.a)}</a>`:esc(s.a)}</h2>${others.length?`<div class="rows">${others.map(o=>`<a class="hist" style="grid-template-columns:minmax(0,1fr) auto" href="#nummer-${o}"><span class="title">${esc(S[o].t)}</span><span class="pts">${nf(S[o].pts)} pt</span></a>`).join("")}</div>`:`<p class="muted">${own?`Dit is het enige nummer van ${esc(s.a)} in je lijsten.`:`Geen nummers van ${esc(s.a)} in je eigen lijsten.`}</p>`}</section>
    </div>
    </div></div>`;
  loadSongCard(+id);
  const mainArtist=(COLLAB[aName]||[s.a.split(", ")[0]])[0].replace(/ \(.*\)$/,"");
  wikiBox("wiki-song","Over dit nummer",{search:`${s.t} ${mainArtist} song`,match:normT(s.t)},`${s.t} ${s.a}`);
}

function spotSection(id){
  const s=S[id];
  if(!s.spRank) return `<h2>Spotify-jaarlijsten</h2><p class="muted">Niet in je Spotify-jaarlijsten.</p>`;
  const rows=SP.map((e,i)=>({e,i})).reverse().map(({e,i})=>{const r=spPres[id][i];
    if(!r) return `<div class="hist off"><span>${e.year}</span><span>niet genoteerd</span><span></span><span class="mvcell"></span></div>`;

function viewSpotifyYear(y){
  const i=SP.findIndex(e=>e.year===y); if(i<0) return viewSpotify();
  const e=SP[i], c=counts(e);
  const F=[["alles","Alles"],["nieuw","Nieuw"],["terug","Terug"]]; if(i>0) F.push(["up","Gestegen"],["down","Gedaald"]); F.push(["own","Ook in top 100"],["live","Live"]);
  let biggest=null; e.rows.forEach(r=>{if(r.mv>0&&(!biggest||r.mv>biggest.mv))biggest=r;});
  app.innerHTML=`<div class="pagehead"><div>
      <div class="eyebrow">Spotify-jaarlijst · ${i+1} van ${NS}</div>
      <h1 style="margin-top:10px">Spotify ${y}</h1>
      <div class="statsline">
        ${i>0?`<span class="stat"><b>${c.nieuw}</b> nieuw</span><span class="stat"><b>${c.terug}</b> terug</span><span class="stat"><b>${c.up}</b> gestegen</span><span class="stat"><b>${c.down}</b> gedaald</span>`:`<span class="stat">Je eerste Spotify-jaarlijst</span>`}
        <span class="stat"><b>${e.rows.filter(r=>S[r.id].n).length}</b> ook in je top 100</span>
        ${biggest?`<span class="stat">Grootste stijger: <b>${esc(S[biggest.id].t)}</b> ▲ ${biggest.mv}</span>`:""}
      </div></div>
      <div class="pager">
        ${i>0?`<a class="btn ghost" href="#spotify-${SP[i-1].year}">← ${SP[i-1].year}</a>`:""}
        ${i<NS-1?`<a class="btn ghost" href="#spotify-${SP[i+1].year}">${SP[i+1].year} →</a>`:""}
      </div></div>
    <p class="note">Je topnummers van ${y} volgens Spotify. Deze lijst telt niet mee voor de Top Aller Tijden, maar wel voor je <a class="alink" href="#spotify-aller-tijden">Spotify-ranglijst</a>.${e.rows.length>100?` Deze lijst heeft ${e.rows.length} nummers; plek 101 krijgt geen punten.`:""}</p>
    <div class="toolbar">
      <input class="search" id="q-sp" type="search" placeholder="Zoek op artiest of titel" aria-label="Zoek in deze lijst">
      <div class="filters" role="group" aria-label="Filter">${F.map(([k,l],j)=>`<button data-f="${k}" aria-pressed="${j===0}">${l}</button>`).join("")}</div>
      <span class="count" id="cnt"></span>
    </div>
    <div class="rows" id="rows"></div>`;
  let f="alles", q="";
  const render=()=>{
    const qq=norm(q);
    const list=e.rows.filter(r=>{const s=S[r.id];
      if(qq&&!norm(s.a+" "+s.t).includes(qq)) return false;
      if(f==="nieuw") return r.status==="nieuw"; if(f==="terug") return r.status==="terug";
      if(f==="up") return r.mv>0; if(f==="down") return r.mv<0;
      if(f==="own") return S[r.id].n>0; if(f==="live") return !!liveOf(r.id); return true;});
    if(f==="up") list.sort((a,b)=>b.mv-a.mv); if(f==="down") list.sort((a,b)=>a.mv-b.mv);
    document.getElementById("rows").innerHTML=list.map(r=>{const s=S[r.id];return `<div class="row">
      <span class="pos">${String(r.pos).padStart(2,"0")}</span><span class="mvcell">${moveHTML(r)}</span>
      <a class="title stretch" href="#nummer-${r.id}">${esc(s.t)}${ownChip(r.id)}${liveChip(r.id)}</a><span class="artist">${esc(s.a)}</span>
      <span class="pts" title="punten">${nf(r.pts)}</span>${playHTML(r.id)}</div>`;}).join("")||'<div class="empty">Geen nummers gevonden.</div>';
    document.getElementById("cnt").textContent=list.length+" nummers";
  };
  document.getElementById("q-sp").addEventListener("input",ev=>{q=ev.target.value;render();});
  app.querySelectorAll(".filters button").forEach(b=>b.addEventListener("click",()=>{f=b.dataset.f;app.querySelectorAll(".filters button").forEach(x=>x.setAttribute("aria-pressed",x===b));render();}));
  render();
}
function viewSpotifyRank(){
  const R=D.spotRank, max=S[R[0]].spPts;

      <div id="rows"></div></div>
    <div class="more"><button class="btn ghost" id="more">Toon alle ${R.length} nummers</button></div>`;

    document.getElementById("cnt").textContent=(qq||f!=="alles")?total+" nummers":list.length+" van "+R.length;
    document.getElementById("more").parentElement.hidden=all||!!qq||f!=="alles";
  };
  document.getElementById("q-spr").addEventListener("input",ev=>{q=ev.target.value;render();});
  document.getElementById("more").addEventListener("click",()=>{all=true;render();});
  app.querySelectorAll(".filters button").forEach(b=>b.addEventListener("click",()=>{f=b.dataset.f;app.querySelectorAll(".filters button").forEach(x=>x.setAttribute("aria-pressed",x===b));render();}));
  render();
}

    </div>
    ${check.length?`<h2 style="margin-top:36px">Even controleren (${check.length})</h2><p class="lede">Bij deze nummers kwam de titel of de artiest niet precies overeen. Klik op ▶ om te horen of het klopt.</p>
    <div class="rows">${check.map(id=>{const v=spotDb[id];return `<div class="row"><span class="pos dim">${S[id].rank}</span><span class="mvcell"><span class="chip ${v.match==="geen"?"new":"ret"}">${v.match==="geen"?"Mis?":"Twijfel"}</span></span><a class="title stretch" href="#nummer-${id}">${esc(S[id].t)}</a><span class="artist">${esc(S[id].a)}<br><small>Spotify: ${esc(v.name)} · ${esc(v.artists)}</small></span><span class="pts"></span>${playHTML(id)}</div>`}).join("")}</div>`:""}`;
  const msg=m=>{const el=document.getElementById("link-msg"); if(el) el.textContent=m;};
  if(!dbRef){ msg("Opslaan kan alleen als je de site in Claude bekijkt en bent ingelogd."); document.getElementById("link-go").disabled=true; return; }
  document.getElementById("link-go").addEventListener("click",()=>startLinking(msg));

async function startLinking(msg){
  if(linkRun) return;
  const mcp=await mcpP;
  if(!mcp){ msg("De Spotify-koppeling is hier niet beschikbaar. Open de site in Claude en sta Spotify toe."); return; }
  linkRun={stop:false}; route();
  const todo=D.alltime.filter(id=>!spotDb[id]);
  let done=0, stopReason="";
  for(const id of todo){
    if(linkRun.stop){ stopReason="Gepauzeerd."; break; }
    const s=S[id];
    let res=null;
    for(let attempt=0;attempt<2&&!res;attempt++){
      try{ res=await mcp.callTool("Spotify","search",{prompt:`${s.t} ${s.a}`,language:"nl-NL",limit:5}); }
      catch(err){
        const code=err&&err.code;
        if(err&&err.retryable&&attempt===0){ await new Promise(r=>setTimeout(r,(err.retryAfterMs||2000)+Math.random()*1000)); continue; }
        if(["needs_reauth","server_not_connected","selection_required","not_in_manifest","blocked_by_policy","not_granted","capability_disabled","capability_removed"].includes(code)){ stopReason=(ERR[code]||"Spotify is niet beschikbaar.").replace(/ Klik nog een keer.*$/,""); }
        break;
      }
    }
    if(stopReason) break;
    const hit=res?scoreTrack(res.payload,s):null;
    const doc={songId:id,artiest:s.a,titel:s.t,trackId:hit?hit.trackId:"",name:hit?hit.name:"",artists:hit?hit.artists:"",match:hit?hit.match:"geen"};
    if(!res){ continue; }
    try{ await dbRef.collection("spotify").doc("s"+id).set(doc); spotDb[id]=doc; }
    catch(e){ stopReason=e&&e.code==="quota_exceeded"?"De opslag is vol.":"Opslaan lukte niet. Probeer het later opnieuw."; break; }
    done++;
    if(done%5===0&&location.hash==="#spotify-koppelen"){ viewLink(); }
    const t=document.getElementById("todo"); if(t) t.textContent=D.alltime.length-Object.keys(spotDb).length;
  }
  linkRun=null;
  if(location.hash==="#spotify-koppelen"){ viewLink(); const el=document.getElementById("link-msg"); if(el) el.textContent=stopReason||"Klaar."; }
}

/* ---------- Nieuwe lijst samenstellen ----------
   Stap 1 swipen tot 150 · stap 2 driekamp 3x, afvallers controleren · stap 3 driekamp 3x, voorstel 31-100
   stap 4 top 30 nog 2x driekamp · stap 5 eindcheck met pijltjes.
   Onder water een Elo-score (zoals bij schaken); op het scherm alleen de plek. */
const NL_KEY="nieuwe-lijst-v1", NL_TARGET_SWIPE=150, NL_SIZE=100, NL_TOP=30;
const PL=D.playlists||[];
const nlCutoff=(()=>{const d=new Date(); d.setMonth(d.getMonth()-6); return d.toISOString().slice(0,10);})();
const nlPlDefault=()=>PL.map((p,i)=>({p,i})).filter(x=>x.p.last>=nlCutoff).map(x=>x.i);
let NL=null, nlLoaded=false, nlSaving=false, nlPending=false, nlSavedAt=null, nlSaveTimer=null;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function nlDefaults(){
  return {v:1,dv:2,stage:"setup",
    sources:{eds:[N-3,N-2,N-1].filter(i=>i>=0),multi:true,sp:[NS-2,NS-1].filter(i=>i>=0),classics:true,pl:nlPlDefault(),plRecent:false},
    extra:[],removed:[],pool:[],swipe:null,elo:{},games:{},tri:null,review:null,proposal:[],final:[],hist:[],date:"",updated:null};
}
function nlPool(){
  const s=NL.sources, set=new Set();
  s.eds.forEach(i=>E[i]&&E[i].rows.forEach(r=>set.add(r.id)));
  if(s.multi) Object.values(S).forEach(x=>{if(x.n>1) set.add(x.id);});
  s.sp.forEach(i=>SP[i]&&SP[i].rows.forEach(r=>set.add(r.id)));
  if(s.classics) Object.values(S).forEach(x=>{if(x.best&&x.best<=25) set.add(x.id);});
  (s.pl||[]).forEach(i=>{const p=PL[i]; if(p) p.ids.forEach(id=>{ if(!s.plRecent||(p.added[id]||"")>=nlCutoff) set.add(id); });});
  NL.extra.forEach(id=>set.add(id));
  NL.removed.forEach(id=>set.delete(id));
  return [...set];
}
/* samengevoegde nummers (13 okt 2026): oude id -> nieuw id; een bestaand concept wordt één keer omgezet */
const NL_MIGRATE={2:{586:206,693:210}};
function nlMigrate(st){
  const dv=st.dv||1; if(dv>=2) return st;
  const M=NL_MIGRATE[2], mp=x=>M[x]??x, uniq=l=>[...new Set(l)];
  const ml=l=>Array.isArray(l)?uniq(l.map(mp)):l;
  st.pool=ml(st.pool); st.extra=ml(st.extra||[]); st.removed=ml(st.removed||[]);
  if(st.swipe){ st.swipe.queue=(st.swipe.queue||[]).map(mp); st.swipe.keep=ml(st.swipe.keep||[]); }
  Object.entries(M).forEach(([o,n])=>{
    if(st.elo&&st.elo[o]!==undefined){
      const go=(st.games&&st.games[o])||0, gn=(st.games&&st.games[n])||0;
      st.elo[n]=st.elo[n]===undefined?st.elo[o]:Math.round(((st.elo[n]*gn+st.elo[o]*go)/Math.max(1,gn+go))*10)/10;
      if(st.games){ st.games[n]=gn+go; delete st.games[o]; }
      delete st.elo[o];
    }
  });
  if(st.tri){ const t=st.tri; t.players=ml(t.players);
    t.groups=(t.groups||[]).map((g,gi)=>{ let m=g.map(mp);
      if(gi>=t.gi&&new Set(m).size<m.length){ m=uniq(m); const pool=shuffle(t.players.filter(x=>!m.includes(x))); while(m.length<3&&pool.length) m.push(pool.pop()); }
      return m; }); }
  if(st.review){ st.review.keep=ml(st.review.keep); st.review.out=ml(st.review.out).filter(x=>!st.review.keep.includes(x)); }
  st.proposal=ml(st.proposal||[]); st.final=ml(st.final||[]);
  st.hist=[]; st.dv=2;
  return st;
}
/* opslaan: in de gedeelde opslag van de site (Claude-versie) en in deze browser */
async function nlLoad(){

function nlSave(now){

async function nlFlush(){
  if(nlSaving){ nlPending=true; return; }
  nlSaving=true;

/* score */
const nlElo=id=>NL.elo[id]??1000;
function nlRankOf(list){ const r={}; [...list].sort((a,b)=>nlElo(b)-nlElo(a)).forEach((id,i)=>r[id]=i+1); return r; }
function nlApplyOrder(order){ // order = [eerste, tweede, derde]
  const K=32, d={};
  order.forEach(id=>d[id]=0);
  for(let i=0;i<order.length;i++) for(let j=i+1;j<order.length;j++){
    const a=order[i], b=order[j], ea=1/(1+Math.pow(10,(nlElo(b)-nlElo(a))/400));
    d[a]+=K*(1-ea); d[b]-=K*(1-ea);
  }
  order.forEach(id=>{ NL.elo[id]=Math.round((nlElo(id)+d[id])*10)/10; NL.games[id]=(NL.games[id]||0)+1; });
}
function nlGroups(players,firstEver){
  let list;
  if(firstEver) list=shuffle(players);
  else list=[...players].sort((a,b)=>(nlElo(b)+(Math.random()-.5)*30)-(nlElo(a)+(Math.random()-.5)*30));
  const g=[]; for(let i=0;i+3<=list.length;i+=3) g.push(list.slice(i,i+3));
  const rest=list.slice(g.length*3);
  if(rest.length){ const others=shuffle(players.filter(id=>!rest.includes(id))); while(rest.length<3&&others.length) rest.push(others.pop()); if(rest.length===3) g.push(rest); }
  return g;
}
function nlStartTri(phase,players,rounds){
  const firstEver=!Object.keys(NL.games).length;
  NL.tri={phase,players,round:1,rounds,groups:nlGroups(players,firstEver),gi:0};
  NL.stage=phase; NL.hist=[];
}

function nlInfo(id){
  const s=S[id], bits=[];
  if(s.n) bits.push(`#${s.rank} aller tijden`); else bits.push("nog nooit in je top 100");

  if(lastSp!==undefined) bits.push(`Spotify ${SP[lastSp].year}: #${spPres[id][lastSp].pos}`);
  else { const pls=PL.filter(p=>p.added[id]).map(p=>p.name); if(pls.length) bits.push("afspeellijst "+pls.slice(0,2).join(", ")); }
  return bits.join(" · ");
}

      ${NL.removed.length?`<p class="muted" style="margin-top:12px">${NL.removed.length} nummer(s) handmatig weggehaald. <button class="btn ghost sm" type="button" id="nl-unrm">Terugzetten</button></p>`:""}
    </details>`;
  nlWireBar(); sb.wire();
  const upd=()=>{ nlSave(); nlSetup(); };
  app.querySelectorAll("[data-ed]").forEach(c=>c.addEventListener("change",()=>{ const i=+c.dataset.ed; s.eds=c.checked?[...new Set([...s.eds,i])]:s.eds.filter(x=>x!==i); upd(); }));
  app.querySelectorAll("[data-sp]").forEach(c=>c.addEventListener("change",()=>{ const i=+c.dataset.sp; s.sp=c.checked?[...new Set([...s.sp,i])]:s.sp.filter(x=>x!==i); upd(); }));
  app.querySelectorAll("[data-eds]").forEach(b=>b.addEventListener("click",()=>{ const v=b.dataset.eds; s.eds=v==="all"?E.map((e,i)=>i):v==="none"?[]:[N-3,N-2,N-1]; upd(); }));
  document.getElementById("nl-multi").addEventListener("change",ev=>{ s.multi=ev.target.checked; upd(); });
  document.getElementById("nl-classics").addEventListener("change",ev=>{ s.classics=ev.target.checked; upd(); });
  app.querySelectorAll("[data-pl]").forEach(c=>c.addEventListener("change",()=>{ const i=+c.dataset.pl; s.pl=c.checked?[...new Set([...(s.pl||[]),i])]:(s.pl||[]).filter(x=>x!==i); upd(); }));
  const plr=document.getElementById("nl-plrecent"); if(plr) plr.addEventListener("change",ev=>{ s.plRecent=ev.target.checked; upd(); });
  app.querySelectorAll("[data-unextra]").forEach(b=>b.addEventListener("click",()=>{ NL.extra=NL.extra.filter(x=>x!==+b.dataset.unextra); upd(); }));
  app.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{ NL.removed.push(+b.dataset.rm); NL.extra=NL.extra.filter(x=>x!==+b.dataset.rm); nlSave(); nlSetup(); const d=app.querySelector(".nl-pool"); if(d) d.open=true; }));
  const ur=document.getElementById("nl-unrm"); if(ur) ur.addEventListener("click",()=>{ NL.removed=[]; upd(); });
  document.getElementById("nl-def").addEventListener("click",()=>{ const keep={extra:[],removed:[]}; NL.sources=nlDefaults().sources; Object.assign(NL,keep); upd(); });
  document.getElementById("nl-start").addEventListener("click",()=>{
    NL.pool=nlPool(); NL.elo={}; NL.games={};
    NL.swipe={round:1,queue:shuffle(NL.pool),keep:[],i:0}; NL.stage="swipe"; NL.hist=[]; nlSave(true); nlRender(); window.scrollTo(0,0);
  });
}

/* stap 1: swipen in paren */
function nlSwipeRemaining(){ const w=NL.swipe; return w.keep.length+Math.max(0,w.queue.length-w.i); }
function nlSwipeFinish(){
  const w=NL.swipe, survivors=[...w.keep,...w.queue.slice(w.i)];
  nlStartTri("tri1",survivors,3); nlSave(true); nlRender(); window.scrollTo(0,0);
}
function nlSwipeDecide(kind){
  const w=NL.swipe, a=w.queue[w.i], b=w.queue[w.i+1];
  NL.hist.push({i:w.i,keepLen:w.keep.length,round:w.round});
  if(NL.hist.length>30) NL.hist.shift();
  if(kind==="left") w.keep.push(a); else if(kind==="right") w.keep.push(b); else if(kind==="both") w.keep.push(a,b);
  w.i+=2;
  nlSwipeAdvance();
}
function nlSwipeAdvance(){
  const w=NL.swipe;
  if(w.i===w.queue.length-1){ w.keep.push(w.queue[w.i]); w.i++; }            // oneven: dit nummer gaat vanzelf door
  if(nlSwipeRemaining()<=NL_TARGET_SWIPE) return nlSwipeFinish();
  if(w.i>=w.queue.length){ w.round++; w.queue=shuffle(w.keep); w.keep=[]; w.i=0; NL.hist=[]; }
  nlSave(); nlSwipe();
}
function nlSwipe(){
  const w=NL.swipe, a=w.queue[w.i], b=w.queue[w.i+1], rem=nlSwipeRemaining();
  const pairsLeft=Math.ceil((w.queue.length-w.i)/2);
  app.innerHTML=nlBar(`Stap 1 · ronde ${w.round} · nog <b>${rem}</b> nummers over · doel ${NL_TARGET_SWIPE} · nog ${pairsLeft} paren deze ronde`)+nlHead("Swipen","Kies welk nummer doorgaat. Je kunt ook allebei houden of allebei laten vallen. Sneltoetsen: ← links, → rechts, ↑ allebei wel, ↓ allebei niet.")+`
    <div class="nl-pair">${nlCard(a,{cls:"sw"})}${nlCard(b,{cls:"sw"})}</div>
    <div class="nl-actions">
      <button class="btn" type="button" data-sw="left">← Links door</button>
      <button class="btn ghost" type="button" data-sw="both">↑ Allebei wel</button>
      <button class="btn ghost" type="button" data-sw="none">↓ Allebei niet</button>
      <button class="btn" type="button" data-sw="right">Rechts door →</button>
    </div>
    <div class="nl-actions sub">
      <button class="btn ghost sm" type="button" id="nl-undo" ${NL.hist.length?"":"disabled"}>Vorige keuze terugdraaien</button>
      <button class="btn ghost sm" type="button" id="nl-stop">Stoppen en door naar de driekamp (${rem} nummers)</button>
    </div>`;
  nlWireBar();
  app.querySelectorAll("[data-sw]").forEach(btn=>btn.addEventListener("click",()=>nlSwipeDecide(btn.dataset.sw)));
  document.getElementById("nl-undo").addEventListener("click",()=>{ const h=NL.hist.pop(); if(!h) return; w.i=h.i; w.keep=w.keep.slice(0,h.keepLen); nlSave(); nlSwipe(); });
  document.getElementById("nl-stop").addEventListener("click",nlSwipeFinish);
}
document.addEventListener("keydown",ev=>{
  if(location.hash!=="#nieuwe-lijst"||!NL||NL.stage!=="swipe") return;
  if(ev.target.closest&&ev.target.closest("input,textarea,select")) return;
  const map={ArrowLeft:"left",ArrowRight:"right",ArrowUp:"both",ArrowDown:"none"};
  if(map[ev.key]){ ev.preventDefault(); nlSwipeDecide(map[ev.key]); }
});

/* stap 2, 3 en 4: driekamp */
let nlPick=[];
function nlTri(){
  const t=NL.tri, g=t.groups[t.gi], ranks=nlRankOf(t.players);
  const label={tri1:["Stap 2","Driekamp"],tri2:["Stap 3","Driekamp, tweede deel"],tri3:["Stap 4","Finale van de top 30"]}[t.phase];
  const played=Object.keys(NL.games).length>0;
  const badge=id=>{const p=nlPick.indexOf(id); return p>=0?`<span class="nl-badge">${p+1}</span>`:"";};
  app.innerHTML=nlBar(`${label[0]} · ronde ${t.round} van ${t.rounds} · groepje ${t.gi+1} van ${t.groups.length} · ${t.players.length} nummers`)+nlHead(label[1],"Klik de nummers aan in volgorde van voorkeur: eerst je favoriet, dan de tweede. De derde volgt vanzelf.")+`
    <div class="nl-trio">${g.map(id=>nlCard(id,{cls:"pick"+(nlPick.includes(id)?" picked":""),attrs:`data-pick="${id}" role="button" tabindex="0" aria-pressed="${nlPick.includes(id)}"`,badge:badge(id),
      foot:`<span class="nl-rank">${played&&NL.games[id]?`staat nu op #${ranks[id]}`:"nog geen plek"}</span>`})).join("")}</div>
    <div class="nl-actions">
      <button class="btn" type="button" id="nl-ok" ${nlPick.length===3?"":"disabled"}>Bevestig volgorde →</button>
      <button class="btn ghost" type="button" id="nl-clear" ${nlPick.length?"":"disabled"}>Opnieuw kiezen</button>
      <button class="btn ghost sm" type="button" id="nl-undo" ${NL.hist.length?"":"disabled"}>Vorig groepje terugdraaien</button>
    </div>`;
  nlWireBar();
  const choose=id=>{ if(nlPick.includes(id)) return; nlPick.push(id); if(nlPick.length===2) nlPick.push(g.find(x=>!nlPick.includes(x))); nlTri(); };
  app.querySelectorAll("[data-pick]").forEach(c=>{ c.addEventListener("click",ev=>{ if(ev.target.closest("a")) return; choose(+c.dataset.pick); });
    c.addEventListener("keydown",ev=>{ if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); choose(+c.dataset.pick);} }); });
  document.getElementById("nl-clear").addEventListener("click",()=>{ nlPick=[]; nlTri(); });
  document.getElementById("nl-ok").addEventListener("click",()=>{
    const prev={}; g.forEach(id=>prev[id]=[NL.elo[id],NL.games[id]]);
    NL.hist.push({gi:t.gi,round:t.round,prev}); if(NL.hist.length>30) NL.hist.shift();
    nlApplyOrder(nlPick); nlPick=[]; t.gi++;
    if(t.gi>=t.groups.length){ t.round++; t.gi=0; NL.hist=[];
      if(t.round>t.rounds){ nlTriDone(); return; }
      t.groups=nlGroups(t.players,false);
    }
    nlSave(); nlTri();
  });
  document.getElementById("nl-undo").addEventListener("click",()=>{ const h=NL.hist.pop(); if(!h) return;
    Object.entries(h.prev).forEach(([id,[e,gm]])=>{ if(e===undefined) delete NL.elo[id]; else NL.elo[id]=e; if(gm===undefined) delete NL.games[id]; else NL.games[id]=gm; });
    t.gi=h.gi; t.round=h.round; nlPick=[]; nlSave(); nlTri(); });
}
function nlTriDone(){
  const t=NL.tri, order=[...t.players].sort((a,b)=>nlElo(b)-nlElo(a));
  if(t.phase==="tri1"){ NL.review={keep:order.slice(0,NL_SIZE),out:order.slice(NL_SIZE)}; NL.stage="review"; }
  else if(t.phase==="tri2"){ NL.proposal=order; NL.stage="proposal"; }
  else { const top=order, rest=NL.proposal.slice(NL_TOP); NL.final=[...top,...rest]; NL.stage="check"; }
  nlSave(true); nlRender(); window.scrollTo(0,0);
}

/* stap 2b: afvallers controleren */
function nlReview(){
  const rv=NL.review, n=rv.keep.length, diff=n-NL_SIZE;
  const sb=nlSearchBox("nl-rv",id=>{ if(!rv.keep.includes(id)){ rv.keep.push(id); rv.out=rv.out.filter(x=>x!==id); const e=Object.values(NL.elo); NL.elo[id]=e.length?e.sort((a,b)=>a-b)[Math.floor(e.length/2)]:1000; } nlSave(); nlReview(); },()=>new Set(rv.keep));
  const row=(id,inKeep)=>`<div class="nl-row"><span class="pos dim">${inKeep?rv.keep.indexOf(id)+1:"–"}</span><span class="nl-rt"><b>${esc(S[id].t)}</b><small>${esc(S[id].a)}</small></span>${previewBtn(id)}<button class="btn ghost sm" type="button" data-${inKeep?"drop":"back"}="${id}">${inKeep?"Eruit":"Terugzetten"}</button></div>`;
  app.innerHTML=nlBar(`Stap 2 klaar · <b>${n}</b> door${diff?` · <span class="warn">${diff>0?diff+" te veel":(-diff)+" te weinig"}</span>`:" · precies 100"}`)+nlHead("Controleer de afvallers",`Na drie rondes driekamp vallen deze ${rv.out.length} nummers af. Zet terug wat toch door moet, haal eruit wat weg mag, of voeg zelf een nummer toe. Je gaat verder met precies ${NL_SIZE} nummers.`)+`
    <div class="nl-two">
      <section><h2>Afvallers (${rv.out.length})</h2><div class="rows">${rv.out.map(id=>row(id,false)).join("")||'<p class="muted">Geen afvallers.</p>'}</div></section>
      <section><h2>Door (${n})</h2>${sb.html}<div class="rows" style="margin-top:12px">${rv.keep.map(id=>row(id,true)).join("")}</div></section>
    </div>
    <div class="nl-actions"><button class="btn" type="button" id="nl-go" ${diff===0?"":"disabled"}>Door naar stap 3 →</button>${diff?`<span class="muted">Zorg eerst voor precies ${NL_SIZE} nummers.</span>`:""}</div>`;
  nlWireBar(); sb.wire();
  app.querySelectorAll("[data-drop]").forEach(b=>b.addEventListener("click",()=>{ const id=+b.dataset.drop; rv.keep=rv.keep.filter(x=>x!==id); rv.out.unshift(id); nlSave(); nlReview(); }));
  app.querySelectorAll("[data-back]").forEach(b=>b.addEventListener("click",()=>{ const id=+b.dataset.back; rv.out=rv.out.filter(x=>x!==id); rv.keep.push(id); nlSave(); nlReview(); }));
  document.getElementById("nl-go").addEventListener("click",()=>{ nlStartTri("tri2",rv.keep.slice(),3); nlSave(true); nlRender(); window.scrollTo(0,0); });
}

/* stap 3b: automatisch voorstel 31-100 */
function nlProposal(){
  const p=NL.proposal;
  app.innerHTML=nlBar(`Stap 3 klaar · voorstel voor plek ${NL_TOP+1} t/m ${NL_SIZE}`)+nlHead("Automatisch voorstel",`Op basis van al je keuzes staan de plekken ${NL_TOP+1} tot en met ${NL_SIZE} nu vast. In stap 5 kun je ze nog met pijltjes verschuiven. De top ${NL_TOP} speelt nog twee rondes driekamp.`)+`
    <div class="nl-two">
      <section><h2>Top ${NL_TOP} (nog in de strijd)</h2><div class="rows">${p.slice(0,NL_TOP).map(id=>`<div class="nl-row"><span class="pos dim">?</span><span class="nl-rt"><b>${esc(S[id].t)}</b><small>${esc(S[id].a)}</small></span>${previewBtn(id)}</div>`).join("")}</div></section>
      <section><h2>Plek ${NL_TOP+1}–${NL_SIZE}</h2><div class="rows">${p.slice(NL_TOP).map((id,i)=>`<div class="nl-row"><span class="pos">${NL_TOP+1+i}</span><span class="nl-rt"><b>${esc(S[id].t)}</b><small>${esc(S[id].a)}</small></span>${previewBtn(id)}</div>`).join("")}</div></section>
    </div>
    <div class="nl-actions"><button class="btn" type="button" id="nl-go">Door naar de finale van de top ${NL_TOP} →</button></div>`;
  nlWireBar();
  document.getElementById("nl-go").addEventListener("click",()=>{ nlStartTri("tri3",p.slice(0,NL_TOP),2); nlSave(true); nlRender(); window.scrollTo(0,0); });
}

/* stap 5: eindcheck */
function nlMove(id){
  const last=E[N-1], r=last.rows.find(x=>x.id===id);
  if(r) return last.kind==="ranked"?`<span class="mv was">was #${r.pos}</span>`:`<span class="mv was">stond erin</span>`;
  return S[id].n?'<span class="chip ret">Terug</span>':'<span class="chip new">Nieuw</span>';
}
function nlPublished(){ const e=E[N-1]; return !!NL&&e&&e.date===NL.date&&e.rows.length===NL.final.length&&e.rows.every((r,i)=>r.id===NL.final[i]); }
function nlCheck(){
  const f=NL.final, done=NL.stage==="klaar";
  const today=new Date().toISOString().slice(0,10);
  app.innerHTML=nlBar(done?`Klaar · je nieuwe lijst van ${NL.date?fmt(NL.date):"vandaag"} is opgeslagen`:`Stap 5 · eindcheck van ${f.length} nummers`)+nlHead(done?"Je nieuwe top 100":"Laatste check",done?(nlPublished()?`Je lijst staat op de site als <a class="alink" href="#lijst-${N}">editie #${N}</a>, met stijgers, dalers en punten. Wil je later weer een nieuwe lijst maken, kies dan Opnieuw beginnen.`:"Laat Claude weten dat je lijst klaar is. Dan wordt hij editie #"+(N+1)+" op je site, met stijgers, dalers en punten."):"Schuif nummers met de pijltjes omhoog of omlaag. Ernaast zie je wat er verandert ten opzichte van je lijst van "+fmt(E[N-1].date)+".")+`
    ${done?"":`<div class="nl-actions" style="margin-top:0"><label class="nl-date">Datum van de lijst <input type="date" id="nl-date" value="${NL.date||today}"></label><button class="btn" type="button" id="nl-done">Lijst afronden en opslaan</button></div>`}
    ${done?`<div class="nl-actions" style="margin-top:0"><button class="btn" type="button" id="nl-copy">Kopieer als tabel (voor Excel)</button><button class="btn ghost" type="button" id="nl-edit">Toch nog aanpassen</button></div>`:""}
    <div class="rows" style="margin-top:16px">${f.map((id,i)=>`<div class="nl-row fin"><span class="pos">${String(i+1).padStart(2,"0")}</span><span class="mvcell">${nlMove(id)}</span>
      <span class="nl-rt"><b>${esc(S[id].t)}${liveChip(id)}</b><small>${esc(S[id].a)}</small></span>${previewBtn(id)}
      ${done?"":`<span class="nl-arrows"><button type="button" class="ar" data-up="${i}" ${i===0?"disabled":""} aria-label="Omhoog">▲</button><button type="button" class="ar" data-down="${i}" ${i===f.length-1?"disabled":""} aria-label="Omlaag">▼</button></span>`}</div>`).join("")}</div>`;
  nlWireBar();
  const swap=(i,j)=>{ [f[i],f[j]]=[f[j],f[i]]; nlSave(); const y=window.scrollY; nlCheck(); window.scrollTo(0,y); };
  app.querySelectorAll("[data-up]").forEach(b=>b.addEventListener("click",()=>{ const i=+b.dataset.up; swap(i,i-1); }));
  app.querySelectorAll("[data-down]").forEach(b=>b.addEventListener("click",()=>{ const i=+b.dataset.down; swap(i,i+1); }));
  const dn=document.getElementById("nl-done"); if(dn) dn.addEventListener("click",()=>{ NL.date=document.getElementById("nl-date").value||today; NL.stage="klaar"; nlSave(true); nlCheck(); window.scrollTo(0,0); });
  const ed=document.getElementById("nl-edit"); if(ed) ed.addEventListener("click",()=>{ NL.stage="check"; nlSave(true); nlCheck(); });
  const cp=document.getElementById("nl-copy"); if(cp) cp.addEventListener("click",async()=>{
    const txt="Plek\tArtiest\tNummer\n"+f.map((id,i)=>`${i+1}\t${S[id].a}\t${S[id].t}`).join("\n");
    try{ await navigator.clipboard.writeText(txt); toast("Gekopieerd. Plak het in Excel."); }catch(e){ toast("Kopiëren lukte niet in deze weergave."); }
  });
}


/* ---------- Reconstructie van een oude lijst (14 okt 2026: lijst van 8 dec 2025) ---------- */
const RC=D.reco||null, RC_KEY=RC?"reco-"+RC.year:"";
let RCO=null, rcTimer=null;
async function rcLoad(){
  let st=null;
  try{ const db=await dbP; if(db){ const d=await db.collection("reconstructie").doc(String(RC.year)).get(); if(d.exists&&d.data().order) st=d.data(); } }catch(e){}
  if(!st){ try{ const l=localStorage.getItem(RC_KEY); if(l) st=JSON.parse(l); }catch(e){} }
  const n=RC.items.length;
  if(st){ const o=typeof st.order==="string"?JSON.parse(st.order):st.order;
    if(Array.isArray(o)&&o.length===n&&new Set(o).size===n) return {order:o,klaar:!!st.klaar}; }
  return {order:RC.items.map((_,i)=>i),klaar:false};
}
function rcSave(now){
  const rec={order:JSON.stringify(RCO.order),klaar:RCO.klaar,updated:new Date().toISOString()};
  try{ localStorage.setItem(RC_KEY,JSON.stringify({order:RCO.order,klaar:RCO.klaar})); }catch(e){}
  clearTimeout(rcTimer);
  rcTimer=setTimeout(async()=>{ try{ const db=await dbP; if(db) await db.collection("reconstructie").doc(String(RC.year)).set(rec); }catch(e){} }, now?0:800);
}
function rcPlay(it){
  if(it.id&&D.songs[it.id]) return playHTML(it.id);
  if(it.tid) return `<a class="play found" href="https://open.spotify.com/track/${esc(it.tid)}" target="_blank" rel="noopener" title="Afspelen op Spotify" aria-label="Speel ${esc(it.t)} af op Spotify">▶</a>`;
  return "<span></span>";
}
function rcWas(it){
  const b=[]; if(it.p24) b.push("2024 ≈#"+it.p24); if(it.p26) b.push("2026 #"+it.p26);
  return b.length?`<span class="mv was">${b.join(" · ")}</span>`:`<span class="mv was">nieuw in ${RC.year}</span>`;
}
async function viewReco(){
  if(!RC){ app.innerHTML='<p class="muted">Er staat geen lijst klaar om te ordenen.</p>'; return; }
  if(!RCO){ app.innerHTML='<p class="muted">Laden…</p>'; RCO=await rcLoad(); if(location.hash!=="#reconstructie-"+RC.year) return; }
  rcRender();
}
function rcRender(){
  const o=RCO.order, n=o.length, cut=Math.min(100,n), done=RCO.klaar;
  const row=(ix,i)=>{ const it=RC.items[ix];
    return `${i===cut&&n>cut?`<div class="rc-cut">Grens top 100 · hieronder ${n-cut} nummers die afvallen</div>`:""}<div class="nl-row fin rc-row${i>=cut?" rc-out":""}"><span class="pos">${String(i+1).padStart(2,"0")}</span><span class="mvcell">${rcWas(it)}</span>
      <span class="nl-rt"><b>${esc(it.t)}${it.src==="toegevoegd"?' <span class="chip ret" title="Niet in je CSV van 2025; door jou toegevoegd">+</span>':""}</b><small>${esc(it.a)}</small></span>${rcPlay(it)}
      ${done?"":`<span class="nl-arrows"><button type="button" class="ar" data-up="${i}" ${i===0?"disabled":""} aria-label="Omhoog">▲</button><button type="button" class="ar" data-down="${i}" ${i===n-1?"disabled":""} aria-label="Omlaag">▼</button><input class="rc-to" type="number" min="1" max="${n}" inputmode="numeric" data-to="${i}" placeholder="#" aria-label="Verplaats naar plek" title="Typ een plek en druk op Enter"></span>`}</div>`; };
  app.innerHTML=`<div class="eyebrow">Reconstructie · ${fmt(RC.date)}</div><h1 style="margin-top:10px">Top 100 van ${RC.year}</h1>
    <p class="lede">${done?"Deze volgorde is opgeslagen. Laat Claude weten dat je klaar bent, dan komt de lijst in je overzicht en op de site.":`Dit is de geschatte volgorde van ${n} nummers. Schuif een nummer met de pijltjes één plek omhoog of omlaag. Een grote sprong maak je door een plek te typen in het vakje <b>#</b> en op Enter te drukken. Je wijzigingen worden vanzelf bewaard.`}</p>
    <div class="nl-actions" style="margin-top:0">${done?`<button class="btn ghost" type="button" id="rc-edit">Toch nog aanpassen</button>`:`<button class="btn" type="button" id="rc-done">Klaar: volgorde opslaan</button><button class="btn ghost" type="button" id="rc-reset">Terug naar de schatting</button>`}<button class="btn ghost" type="button" id="rc-copy">Kopieer als tabel (voor Excel)</button></div>
    <p class="muted" style="font-size:12.5px;margin-top:10px">Naast elk nummer: de plek in 2024 (≈ geschat) en 2026. <span class="chip ret">+</span> = door jou toegevoegd, stond niet in je CSV van ${RC.year}.</p>
    <div class="rows" style="margin-top:12px">${o.map(row).join("")}</div>`;
  const redraw=()=>{ rcSave(); const y=window.scrollY; rcRender(); window.scrollTo(0,y); };
  const move=(i,j)=>{ j=Math.max(0,Math.min(n-1,j)); if(i===j) return; const [x]=o.splice(i,1); o.splice(j,0,x); redraw(); };
  app.querySelectorAll("[data-up]").forEach(b=>b.addEventListener("click",()=>{ const i=+b.dataset.up; move(i,i-1); }));
  app.querySelectorAll("[data-down]").forEach(b=>b.addEventListener("click",()=>{ const i=+b.dataset.down; move(i,i+1); }));
  app.querySelectorAll("[data-to]").forEach(inp=>inp.addEventListener("keydown",ev=>{ if(ev.key!=="Enter") return; const v=parseInt(inp.value,10); if(v>=1) move(+inp.dataset.to,v-1); }));
  const dn=document.getElementById("rc-done"); if(dn) dn.addEventListener("click",()=>{ RCO.klaar=true; rcSave(true); rcRender(); window.scrollTo(0,0); toast("Opgeslagen."); });
  const ed=document.getElementById("rc-edit"); if(ed) ed.addEventListener("click",()=>{ RCO.klaar=false; rcSave(true); rcRender(); });
  const rs=document.getElementById("rc-reset"); if(rs) rs.addEventListener("click",()=>{ RCO.order=RC.items.map((_,i)=>i); rcSave(true); rcRender(); toast("Terug naar de schatting."); });
  document.getElementById("rc-copy").addEventListener("click",async()=>{
    const txt="Plek\tArtiest\tNummer\n"+o.map((ix,i)=>`${i+1}\t${RC.items[ix].a}\t${RC.items[ix].t}`).join("\n");
    try{ await navigator.clipboard.writeText(txt); toast("Gekopieerd. Plak het in Excel."); }catch(e){ toast("Kopiëren lukte niet in deze weergave."); }
  });
}

/* ---------- router ---------- */
function route(){
  const h=location.hash.slice(1)||"start";
  let nav="start";
  if(h.startsWith("lijst-")) viewEdition(+h.slice(6)-1);
  else if(h.startsWith("nummer-")) {viewSong(+h.slice(7)); nav="";}
  else if(h.startsWith("artiest-")) {viewArtist(h.slice(8)); nav="artiesten";}
  else if(h==="aller-tijden"){viewAllTime();nav=h;}
  else if(h==="alle-nummers"){viewAll();nav=h;}
  else if(h==="artiesten"){viewArtists();nav=h;}
  else if(h==="records"){viewRecords();nav=h;}
  else if(h==="spotify-koppelen"){viewLink();nav="";}
  else if(h==="nieuwe-lijst"){viewNieuweLijst();nav="nieuwe-lijst";}
  else if(h.startsWith("reconstructie-")){viewReco();nav="nieuwe-lijst";}
  else if(h==="spotify"){viewSpotify();nav="spotify";}
  else if(h==="spotify-aller-tijden"){viewSpotifyRank();nav="spotify";}
  else if(/^spotify-\d{4}$/.test(h)){viewSpotifyYear(+h.slice(8));nav="spotify";}
  else viewHome();
  document.querySelectorAll("nav.main a").forEach(a=>{ if(a.dataset.nav===nav) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  try{const cur=document.querySelector("nav.main a[aria-current]"); if(cur) cur.scrollIntoView({inline:"center",block:"nearest"});}catch(e){}
  window.scrollTo(0,0);
}
document.getElementById("foot").textContent=`Bron: Totaal overzicht top 100 · ${N} lijsten van ${fmt(E[0].date)} tot ${fmt(E[N-1].date)} · Spotify-jaarlijsten ${SP.length?SP[0].year+"–"+SP[NS-1].year:""}`;
window.addEventListener("hashchange",route);
route();
</script>
